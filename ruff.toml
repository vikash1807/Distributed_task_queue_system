# Ruff configuration

target-version = "py313"  # Set minimum Python version
line-length = 100

# Exclude specific directories
exclude = [
    ".venv",
    ".git",
    ".vscode",
    "__pycache__",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes (includes unused imports, variables)
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "E501",   # line too long
]
ignore = [
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
]

# Fixable settings belong inside the main [lint] table
fixable = ["ALL"]
unfixable = []

# Sub-tables must come AFTER all top-level [lint] key-value pairs
[lint.pycodestyle]
ignore-overlong-task-comments = false

[format]
quote-style = "double"  # Use double quotes for strings
indent-style = "space"  # Indent with spaces
skip-magic-trailing-comma = false  # Use trailing commas
line-ending = "auto"  # Auto-detect line ending